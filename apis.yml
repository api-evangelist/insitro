aid: insitro
name: insitro
description: >-
  insitro is a machine-learning-driven drug discovery and development company
  founded in 2018 by Daphne Koller and headquartered in South San Francisco,
  California. It combines large-scale in vitro cellular data generated in its own
  automated labs with human clinical and genetic data to build predictive models
  of biology, aiming to bring better drugs faster to the patients most likely to
  benefit. Its therapeutic focus spans metabolism, oncology, and neuroscience,
  and its interdisciplinary teams pair life scientists, data scientists, and
  engineers. insitro operates no public developer API; it maintains open-source
  research and infrastructure tooling (such as the redun workflow engine) on its
  GitHub organization. Backed by a16z, GV, and the SoftBank Vision Fund.
